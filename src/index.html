<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>TermoCalc Demo</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    /*
      Fundo branco imediato evita o flash preto do WebView (antes de o CSS pintar)
      na transição da splash nativa para o loader.
    */
    html,
    body {
      background-color: #ffffff;
    }

    /*
      No Android 12+ a splash nativa (androidx.core.splashscreen) não suporta spinner.
      Este loader repete o mesmo logo da splash nativa e soma um spinner, para que a
      transição splash -> loader pareça uma única tela contínua (ver main.ts).
    */
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #ffffff;
    }

    #boot-loader.boot-loader--hidden {
      display: none;
    }

    .boot-loader__logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }

    .boot-loader__spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(106, 0, 128, 0.15);
      border-top-color: #6a0080;
      border-radius: 50%;
      animation: boot-loader-spin 0.8s linear infinite;
    }

    @keyframes boot-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="boot-loader" aria-hidden="true">
    <img class="boot-loader__logo" src="assets/imgs/splash-logo.png" alt="" />
    <div class="boot-loader__spinner"></div>
  </div>
  <app-root></app-root>

  <script>
    // Oculta a splash nativa só quando o loader HTML já está pintado (mesmo logo),
    // eliminando o flash preto do WebView entre a splash e o loader.
    (function () {
      function hideNativeSplash() {
        var plugins = window.Capacitor && window.Capacitor.Plugins;
        if (plugins && plugins.SplashScreen) {
          plugins.SplashScreen.hide();
        }
      }
      window.addEventListener('DOMContentLoaded', function () {
        var logo = document.querySelector('.boot-loader__logo');
        if (logo && !logo.complete) {
          logo.addEventListener('load', hideNativeSplash);
          logo.addEventListener('error', hideNativeSplash);
        } else {
          hideNativeSplash();
        }
      });
    })();
  </script>
</body>

</html>
